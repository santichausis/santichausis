name: Update merged PRs

on:
  schedule:
    # GitHub a veces directamente no dispara un schedule (pasó 2 lunes seguidos, sin error
    # ni registro del run). El script es idempotente — si ya está todo al día no commitea
    # ni manda mail — así que varios intentos por semana son un backup gratis, no un riesgo
    # de spam: el primero que efectivamente corre hace el trabajo, el resto no hace nada.
    - cron: '13 9 * * 1'    # lunes 09:13 UTC (~06:13 ART) — intento principal
    - cron: '13 15 * * 1'   # lunes 15:13 UTC (~12:13 ART) — backup mismo día
    - cron: '13 9 * * 2'    # martes 09:13 UTC — backup final
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions
    inputs:
      test_email:
        description: 'Mandar un mail de prueba (sin tocar el README)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate PR section
        id: regen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme_prs.py

      - name: Commit if changed
        id: commit
        run: |
          before_sha=$(git rev-parse HEAD)
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md scripts/weekly_state.json
            git commit -m "chore: refresh merged PRs in README"
            git push
            after_sha=$(git rev-parse HEAD)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "diff_url=https://github.com/${{ github.repository }}/compare/${before_sha}...${after_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "diff_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test email
        if: inputs.test_email && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: schausis@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🧪 Test — notificación de perfil GitHub"
          to: schausis@gmail.com
          from: GitHub Actions
          body: |
            Mail de prueba: la notificación funciona.
            A partir de ahora vas a recibir un mail cada vez que tu perfil se actualice con PRs nuevos.

      # Se manda si hubo novedades reales (cualquier trigger) O si es el intento de respaldo
      # final del martes (aunque no haya nada nuevo) — así siempre hay al menos un pulso
      # semanal, incluso las semanas sin PRs mergeados.
      - name: Send weekly email
        if: (steps.commit.outputs.changed == 'true' || github.event.schedule == '13 9 * * 2') && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: schausis@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.regen.outputs.email_subject }}
          to: schausis@gmail.com
          from: GitHub Actions
          html_body: |
            ${{ steps.regen.outputs.email_html }}
            <p style="font-size:12px;color:#888">
              ${{ steps.commit.outputs.diff_url && format('<a href="{0}">See what changed</a> · ', steps.commit.outputs.diff_url) || '' }}
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Run log</a>
            </p>
