name: Update merged PRs

on:
  schedule:
    # GitHub a veces directamente no dispara un schedule (pasó 2 lunes seguidos, sin error
    # ni registro del run) — por eso hay 3 intentos por semana en vez de uno. El script
    # decide por su cuenta cuándo commitear y cuándo mandar mail (máximo 1 mail/semana,
    # ver update_readme_prs.py), así que los intentos de más son backup, no riesgo de spam.
    - cron: '13 9 * * 1'    # lunes 09:13 UTC (~06:13 ART) — intento principal
    - cron: '13 15 * * 1'   # lunes 15:13 UTC (~12:13 ART) — backup mismo día
    - cron: '13 9 * * 2'    # martes 09:13 UTC — backup final
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions
    inputs:
      test_email:
        description: 'Mandar el digest real como mail de prueba (con prefijo TEST)'
        type: boolean
        default: false
      test_alert:
        description: 'Simular una falla para probar el mail de alerta (corta antes de tocar nada)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest migra a Ubuntu 26 el 2026-10-19
    timeout-minutes: 15
    env:
      MAIL_USER: schausis@gmail.com
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Los tests corren ANTES de regenerar: si alguien rompe el guardia de sanidad o el cap
      # de mails, el run se corta (y avisa) en vez de publicar con lógica rota.
      - name: Run tests
        id: tests
        run: python3 -m unittest discover -s tests -v

      - name: Simulate failure (test_alert)
        id: simulate
        if: inputs.test_alert
        run: |
          echo "abort_reason=Simulated failure to exercise the alert email" >> "$GITHUB_OUTPUT"
          echo "Simulated failure" >&2
          exit 1

      - name: Regenerate PR section
        id: regen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme_prs.py

      - name: Commit if changed
        id: commit
        run: |
          before_sha=$(git rev-parse HEAD)
          if [[ -n "$(git status --porcelain README.md scripts/weekly_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md scripts/weekly_state.json
            git commit -m "chore: refresh merged PRs in README"
            git push
            after_sha=$(git rev-parse HEAD)
            echo "diff_url=https://github.com/${{ github.repository }}/compare/${before_sha}...${after_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios."
            echo "diff_url=" >> "$GITHUB_OUTPUT"
          fi

      # Todo el contenido entra al mailer por variables de entorno (no se interpola en el
      # script de shell), y la contraseña solo existe en los steps que mandan mail.
      - name: Test email
        if: inputs.test_email
        env:
          SMTP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          EMAIL_SUBJECT: ${{ steps.regen.outputs.email_subject }}
          EMAIL_HTML: ${{ steps.regen.outputs.email_html }}
          SUBJECT_PREFIX: "🧪 TEST: "
          HTML_PREFIX: '<p style="color:#c00;font-size:12px">⚠️ Test email — este es el contenido real del digest, sin el tope semanal.</p>'
          DIFF_URL: ${{ steps.commit.outputs.diff_url }}
        run: python3 scripts/mailer.py

      # send_email lo decide Python: como mucho 1 mail por semana ISO (si el cron dispara
      # varias veces con novedades, solo la primera manda; el resto se acumula para ese
      # mismo mail o para el próximo). El pulso "sin novedades" solo sale si para el momento
      # en que corre esto (martes en adelante) todavía no se mandó nada esa semana.
      - name: Send weekly email
        if: steps.regen.outputs.send_email == 'true'
        env:
          SMTP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          EMAIL_SUBJECT: ${{ steps.regen.outputs.email_subject }}
          EMAIL_HTML: ${{ steps.regen.outputs.email_html }}
          DIFF_URL: ${{ steps.commit.outputs.diff_url }}
        run: python3 scripts/mailer.py

      # Cualquier falla (tests, guardia de sanidad, API caída, push rechazado) avisa por mail
      # con el motivo, sin depender de las notificaciones de Actions de tu cuenta.
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          SMTP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          EMAIL_SUBJECT: "⚠️ GitHub profile update FAILED"
          EMAIL_HTML: |
            <p><strong>The weekly profile update did not complete.</strong> The published README may be stale; the next scheduled attempt will retry.</p>
            <p>Reason: ${{ steps.regen.outputs.abort_reason || steps.simulate.outputs.abort_reason || 'not captured — see the run log' }}</p>
            <p style="font-size:12px;color:#888">Step outcomes — tests: ${{ steps.tests.outcome }} · regenerate: ${{ steps.regen.outcome }} · commit: ${{ steps.commit.outcome }}</p>
        run: python3 scripts/mailer.py
