name: Update merged PRs

on:
  schedule:
    # GitHub a veces directamente no dispara un schedule (pasó 2 lunes seguidos, sin error
    # ni registro del run) — por eso hay 3 intentos por semana en vez de uno. El script
    # decide por su cuenta cuándo commitear y cuándo mandar mail (máximo 1 mail/semana,
    # ver update_readme_prs.py), así que los intentos de más son backup, no riesgo de spam.
    - cron: '13 9 * * 1'    # lunes 09:13 UTC (~06:13 ART) — intento principal
    - cron: '13 15 * * 1'   # lunes 15:13 UTC (~12:13 ART) — backup mismo día
    - cron: '13 9 * * 2'    # martes 09:13 UTC — backup final
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions
    inputs:
      test_email:
        description: 'Mandar un mail de prueba (sin tocar el README)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate PR section
        id: regen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme_prs.py

      - name: Commit if changed
        id: commit
        run: |
          before_sha=$(git rev-parse HEAD)
          if [[ -n "$(git status --porcelain README.md scripts/weekly_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md scripts/weekly_state.json
            git commit -m "chore: refresh merged PRs in README"
            git push
            after_sha=$(git rev-parse HEAD)
            echo "diff_url=https://github.com/${{ github.repository }}/compare/${before_sha}...${after_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios."
            echo "diff_url=" >> "$GITHUB_OUTPUT"
          fi

      # Manda el contenido REAL (mismo subject/html que "Send weekly email") con un prefijo
      # de test, para poder verificar el digest completo sin esperar a que cambie algo.
      - name: Test email
        if: inputs.test_email && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: schausis@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🧪 TEST: ${{ steps.regen.outputs.email_subject }}"
          to: schausis@gmail.com
          from: GitHub Actions
          html_body: |
            <p style="color:#c00;font-size:12px">⚠️ Test run — el README no se tocó.</p>
            ${{ steps.regen.outputs.email_html }}

      # send_email lo decide Python: como mucho 1 mail por semana ISO (si el cron dispara
      # varias veces con novedades, solo la primera manda; el resto se acumula para ese
      # mismo mail o para el próximo). El pulso "sin novedades" solo sale si para el momento
      # en que corre esto (martes en adelante) todavía no se mandó nada esa semana.
      - name: Send weekly email
        if: steps.regen.outputs.send_email == 'true' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: schausis@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.regen.outputs.email_subject }}
          to: schausis@gmail.com
          from: GitHub Actions
          html_body: |
            ${{ steps.regen.outputs.email_html }}
            <p style="font-size:12px;color:#888">
              ${{ steps.commit.outputs.diff_url && format('<a href="{0}">See what changed</a> · ', steps.commit.outputs.diff_url) || '' }}
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Run log</a>
            </p>
